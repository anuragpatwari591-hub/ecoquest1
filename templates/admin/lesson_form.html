{% extends "base.html" %}
{% block title %}{% if lesson and lesson.lesson_id %}Edit lesson{% else %}New lesson{% endif %}{% endblock %}
{% block content %}
<div class="container page" style="max-width:820px">
  <p class="small"><a href="{{ url_for('admin.lessons') }}">← All lessons</a></p>
  <h1>{% if lesson and lesson.lesson_id %}Edit lesson{% else %}New lesson{% endif %}</h1>
  <form class="card" method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <div class="grid grid-3">
      <div class="field"><label for="title">Title</label><input type="text" id="title" name="title" value="{{ lesson.title if lesson else '' }}" required maxlength="150"></div>
      <div class="field"><label for="topic_id">Topic</label><select id="topic_id" name="topic_id">
        {% for t in topics %}<option value="{{ t.topic_id }}" {% if lesson and lesson.topic_id|string == t.topic_id|string %}selected{% endif %}>{{ t.name }}</option>{% endfor %}</select></div>
      <div class="field"><label for="difficulty">Difficulty</label><select id="difficulty" name="difficulty">
        {% for d in ['Beginner', 'Intermediate', 'Advanced'] %}<option {% if lesson and lesson.difficulty == d %}selected{% endif %}>{{ d }}</option>{% endfor %}</select></div>
    </div>
    <div class="field"><label for="introduction">Introduction</label><textarea id="introduction" name="introduction" required>{{ lesson.introduction if lesson else '' }}</textarea></div>
    <div class="field"><label for="explanation">Explanation</label><textarea id="explanation" name="explanation" required style="min-height:160px">{{ lesson.explanation if lesson else '' }}</textarea></div>
    <div class="field"><label for="key_points">Key points (one per line)</label><textarea id="key_points" name="key_points" required>{{ lesson.key_points if lesson else '' }}</textarea></div>
    <div class="field"><label for="eco_tip">Eco-tip</label><input type="text" id="eco_tip" name="eco_tip" value="{{ lesson.eco_tip if lesson else '' }}" required maxlength="300"></div>
    <button class="btn" type="submit">Save lesson</button>
  </form>
</div>
{% endblock %}
