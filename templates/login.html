{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="container page">
  <div class="auth-wrap card">
    <h1>Welcome back 🌱</h1>
    <p class="muted">Log in to continue your EcoQuest journey.</p>
    <form method="post" action="{{ url_for('auth.login') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <div class="field"><label for="email">Email</label>
        <input type="email" id="email" name="email" value="{{ email }}" required autocomplete="email"></div>
      <div class="field"><label for="password">Password</label>
        <input type="password" id="password" name="password" required autocomplete="current-password"></div>
      <button class="btn" type="submit" style="width:100%">Login</button>
    </form>
    <p class="center small">New here? <a href="{{ url_for('auth.register') }}">Create a student account</a></p>
  </div>
</div>
{% endblock %}
