{% extends "base.html" %}
{% block title %}Change password{% endblock %}
{% block content %}
<div class="container page" style="max-width:520px">
  <h1>🔑 Change password</h1>
  <form class="card" method="post" action="{{ url_for('extras.change_password') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <div class="field"><label for="current">Current password</label><input type="password" id="current" name="current" required autocomplete="current-password"></div>
    <div class="field"><label for="new">New password (min 6 characters)</label><input type="password" id="new" name="new" required minlength="6" autocomplete="new-password"></div>
    <div class="field"><label for="confirm">Repeat new password</label><input type="password" id="confirm" name="confirm" required minlength="6" autocomplete="new-password"></div>
    <button class="btn" type="submit">Change password</button>
    <a class="btn btn-outline" href="{{ url_for('student.profile') }}">Cancel</a>
  </form>
  <p class="small muted">Forgot your password? Ask your teacher or the administrator to reset it.</p>
</div>
{% endblock %}
